[project]
name = "patternscan"
version = "0.1.0"
description = "1·3·5분봉의 직전 모양을 과거에서 찾아 단타 진입 여부를 판정합니다"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
patternscan = "patternscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["patternscan*"]

[tool.setuptools.package-data]
"patternscan.webui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # 줄 길이는 formatter에 맡긴다
    "RUF001",  # 한글 주석의 전각 문자 경고
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "RUF059"]
