# 업비트 봉을 **미리 받아 둔다** — 자주 바뀌는 쪽.
#
# 왜 이게 있는가
# -------------
# 브라우저에서 업비트를 직접 부르면 **분당 6번**밖에 못 받는다. 업비트가
# 브라우저 요청(Origin 헤더가 붙은 요청)을 `origin`이라는 별도 한도 묶음에
# 넣기 때문이다 — 서버에서 부르면 같은 주소가 분당 600번이다. 100배 차이고
# 헤더에 대놓고 적혀 있다.
#
#     Origin 없이   → remaining-req: group=candles; min=600; sec=9
#     Origin 붙여서 → remaining-req: group=origin;  min=6;   sec=0
#
# 그래서 브라우저가 업비트를 안 부르게 한다. 여기서, 서버에서, 미리 받아
# 파일로 적어 둔다.
#
# 무엇을 적는가
# ------------
#   tail/<종목>.json    최근 2일   ~90KB    매번
#   month/<종목>.json   이번 달    ~1.3MB   한 시간에 한 번쯤
#
# 지나간 달은 여기서 안 건드린다 — history.yml이 맡는다. 안 바뀌는 것을
# 자주 바뀌는 것과 섞어 두면, 10분마다 4년치를 통째로 오르내리게 된다.
#
# `data` 브랜치에 **덮어쓴다**(force push). 늘 커밋 하나만 남으므로
# 저장소가 안 불어난다.

name: 봉 미리 받기

on:
  schedule:
    # 10분마다. 예약 실행은 깃허브 사정에 따라 몇 분 늦어질 수 있다.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candles
  cancel-in-progress: false

jobs:
  fetch:
    name: 받아서 적기
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 지난번에 적어 둔 것을 가져온다. 있으면 이어 붙이면 되므로 한 쪽이면
      # 끝나고, 없으면 처음부터 받는다.
      - name: 지난번 파일 가져오기
        run: |
          mkdir -p data/tail data/month
          for m in KRW-BTC KRW-ETH KRW-XRP KRW-SOL; do
            for kind in tail month; do
              curl -fsSL --max-time 120 \
                -o "data/$kind/$m.json" \
                "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/$kind/$m.json" \
                || echo "  $m $kind: 지난번 파일 없음"
            done
          done

      - name: 업비트에서 받기
        run: python tools/candles.py --mode tail --out data

      - name: 적어 둔 것 확인
        run: |
          python - <<'PY'
          import json, pathlib, datetime, sys
          from tools.pack import unpack
          total = 0
          for p in sorted(pathlib.Path("data").rglob("*.json")):
              rows = unpack(json.loads(p.read_text()))
              if not rows:
                  print(f"{p}: 비었습니다", file=sys.stderr)
                  continue
              last = datetime.datetime.fromtimestamp(rows[-1][0], datetime.timezone.utc)
              print(f"{p}: {len(rows):,}개, 마지막 {last:%m-%d %H:%M} UTC, {p.stat().st_size/1024:.0f}KB")
              total += 1
          assert total >= 4, f"{total}개밖에 못 적었습니다"
          PY

      # `data` 브랜치를 통째로 갈아 끼운다. 커밋은 늘 하나만 남는다.
      # 안 바뀐 파일은 깃이 알아서 안 올린다 (내용이 같으면 같은 객체다).
      - name: data 브랜치에 올리기
        run: |
          pub=$(mktemp -d)
          cp -r data/. "$pub/"
          cd "$pub"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "봉 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "올렸습니다: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/tail/KRW-BTC.json"
