name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 테스트
        # 테스트는 전부 오프라인이다. 네트워크를 타는 테스트가 섞여 들어오면
        # CI가 업비트 장애나 레이트 리밋에 흔들리게 되므로 여기서 막는다.
        run: python -m pytest -q

  # 이름표(name)는 한글이어도 되지만 **왼쪽의 job 아이디는 영문이어야 한다.**
  # 한글로 쓰면 깃허브가 파일 전체를 못 읽어서, 이 파일의 다른 작업까지
  # 통째로 시작조차 안 된다 (작업 0개짜리 실패로 끝난다).
  webapp:
    name: 웹앱 (파이썬 결과와 대조)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 자바스크립트 시험
        # 같은 계산이 파이썬과 자바스크립트 두 벌로 있다. 이 시험이
        # 둘이 갈렸는지 본다 — 한쪽만 고치면 여기서 걸린다.
        run: node --test "tests/js/*.test.js"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 정답지가 최신인지
        # 정답지(tests/js/goldens)는 파이썬이 만든다. 파이썬 계산을 고치고
        # 정답지를 다시 안 뽑으면, 자바스크립트는 **옛날 파이썬**과 대조하며
        # 계속 통과한다. 그 상태로 몇 주가 지나면 어디서 갈렸는지 못 찾는다.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python3 tools/goldens.py
          git diff --exit-code --stat tests/js/goldens \
            || (echo "::error::정답지가 낡았습니다. python3 tools/goldens.py 를 돌리고 커밋하세요." && exit 1)

  lint:
    name: 린트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: python -m ruff check patternscan tests

      - name: 임포트 점검
        # 패키지가 실제로 import 되고 CLI가 뜨는지 확인한다.
        # 순환 임포트는 테스트만으로는 놓치기 쉽다.
        run: |
          python -c "import patternscan; print(patternscan.__version__)"
          python -m patternscan --help
          python -m patternscan scan --help
          # 화면 파일이 패키지에 같이 들어갔는지 (빠지면 ui가 빈 화면이 된다)
          python -c "from patternscan.webui.server import STATIC; assert (STATIC / 'index.html').is_file(), STATIC"
