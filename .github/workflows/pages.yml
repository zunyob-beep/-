# 웹앱을 GitHub Pages에 올린다.
#
# 이걸 켜 두면 코드를 밀어 넣을 때마다 주소가 알아서 갱신된다. 아이패드
# 홈 화면의 아이콘은 그 주소를 가리키므로, 다음에 열 때 새 판이 뜬다.
#
# **처음 한 번은 사람이 해야 하는 일이 있다** (README에 적어 뒀다):
#   1. 저장소를 공개(Public)로 바꾼다 — 무료 요금제에서 Pages는 공개
#      저장소에서만 됩니다.
#   2. Settings → Pages → Source를 **GitHub Actions**로 고른다.
#
# 올리기 전에 테스트를 먼저 돌린다. 계산이 깨진 판이 아이패드까지
# 올라가면, 화면에는 그럴듯한 숫자가 그대로 찍히기 때문에 알아채기 어렵다.

name: 웹앱 올리기

on:
  push:
    branches:
      - main
      - claude/bitcoin-auto-trading-program-cxyddm
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 올리는 중에 또 밀어 넣으면 나중 것이 이긴다. 중간에 끊지는 않는다 —
# 반쯤 올라간 상태로 남는 게 제일 나쁘다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  검사:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 파이썬 결과와 대조
        run: node --test "tests/js/*.test.js"

  올리기:
    needs: 검사
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: web 폴더만 담기
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
